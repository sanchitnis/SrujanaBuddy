<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growth Mindset Baseline</title>
  <style>
    body { font-family: Georgia, serif; margin: 24px; background: #f6f3ed; color: #1f2937; }
    .card { max-width: 860px; margin: 0 auto; background: #fff; border: 1px solid #d6d3d1; border-radius: 12px; padding: 20px; }
    h1 { margin-top: 0; }
    .q { margin: 14px 0; padding: 12px; background: #fafaf9; border-radius: 8px; }
    button { margin-top: 12px; padding: 10px 14px; border-radius: 8px; border: 0; background: #0f766e; color: #fff; cursor: pointer; }
    textarea { width: 100%; min-height: 130px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Growth Mindset Baseline</h1>
    <p>Rate each statement from 1 (strongly disagree) to 5 (strongly agree).</p>
    <div id="questions"></div>
    <button onclick="scoreTest()">Generate Result</button>
    <button onclick="copyResult()">Copy to Clipboard</button>
    <textarea id="result" readonly></textarea>
  </div>
  <script>
    const items = [
      "I can improve my intelligence through practice.",
      "When I fail, I try a different strategy.",
      "Difficult topics are opportunities to grow.",
      "Feedback helps me become better.",
      "I avoid challenges that might expose weakness.",
      "Effort matters as much as talent in learning.",
      "I can train my focus and discipline over time.",
      "Mistakes are useful signals, not identity labels."
    ];
    const reverse = [4];
    const q = document.getElementById('questions');
    items.forEach((text, i) => {
      const row = document.createElement('div');
      row.className = 'q';
      row.innerHTML = `<label>${i + 1}. ${text}</label><br/>` +
        [1,2,3,4,5].map(v => `<label><input type="radio" name="q${i}" value="${v}"> ${v}</label>`).join(' ');
      q.appendChild(row);
    });

    function scoreTest() {
      let total = 0;
      for (let i = 0; i < items.length; i++) {
        const checked = document.querySelector(`input[name=q${i}]:checked`);
        if (!checked) { alert('Please answer all questions.'); return; }
        let val = Number(checked.value);
        if (reverse.includes(i)) val = 6 - val;
        total += val;
      }
      const max = items.length * 5;
      const pct = Math.round((total / max) * 100);
      let band = 'Strong Growth Mindset';
      if (pct < 50) band = 'Fixed-Mindset Risk';
      else if (pct < 75) band = 'Mixed Mindset';
      document.getElementById('result').value = `Growth Mindset Score: ${total}/${max} (${pct}%)\nBand: ${band}\n\nAction:\n1) Pick one hard concept this week.\n2) Track attempts, not just outcomes.\n3) Write one learning reflection after setbacks.`;
    }

    function copyResult() {
      const text = document.getElementById('result');
      text.select();
      document.execCommand('copy');
      alert('Result copied.');
    }
  </script>
</body>
</html>
