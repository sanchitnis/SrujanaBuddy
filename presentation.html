timeline
    title The Evolution of Software
    1960 onwards : Software 1.0 — Rule-Based
              : Programmer writes every instruction
              : Rigid. Predictable. No judgement.

              : Neural networks trained on examples
              : Flexible patterns. Still no language.
    2025 onwards  : Software 3.0 — Language-First Intelligence
              : You describe what you want in plain language
              : AI reasons, plans, and acts
</div>

<div class="chat-student">

</div>
<p><strong>The outcome:</strong> Arjun realized his answers pointed to the startup — and the startup was in AI. The paths weren't in conflict. He needed to see it clearly.</p>
<blockquote>
<p><em>Socratic coaching — SrujanaBuddy never told him the answer. He found it himself.</em></p>

<h1 id="the-ask--be-part-of-history">The Ask — Be Part of History</h1>
<blockquote>
<p><em>&quot;The best way to predict the future is to create it.&quot;</em> — Alan Kay</p>

<h3 id="we-are-looking-for">We are looking for:</h3>
<p><strong>Faculty Beta Testers (2–3 volunteers)</strong></p>
<ul>
<li>Use SrujanaBuddy alongside your existing mentoring</li>
<li>Provide weekly feedback on student outcomes</li>
<li>Help identify subject-specific coaching gaps</li>
</ul>
<p><strong>Student Beta Testers (5–10 volunteers)</strong></p>
<ul>
<li>Commit to weekly coaching sessions for one semester</li>
<li>Share anonymized progress signals (with consent)</li>
<li>Help evolve the system through real use</li>
</ul>
<p><strong>Faculty Contributors (1–2 per course)</strong></p>
<ul>
<li>Help build Course Buddy instances for your subject</li>
<li>Co-author subject-specific knowledge base entries</li>
<li>Become internal open source maintainers at REVA</li>
</ul>
</section>
